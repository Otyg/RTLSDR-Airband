# Scanning mode example
# Single dongle, three frequencies, output to Icecast server and to a file.
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  correction = 80;
  mode = "scan";
  channels:
  (
    {
      freqs = ( 118.15, 124.7, 132.1 );
      labels = ( "Tower", "Ground", "Approach" );
      outputs: (
        {
          type = "icecast";
          server = "icecast.server.example.org";
          port = 8080;
          mountpoint = "stream.mp3";
          name = "Tower + Ground + Approach";
          genre = "ATC";
          description = "My local airport - aggregated feed";
          username = "source";
          password = "mypassword";
          send_scan_freq_tags = false;
        },
        {
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "TWR+GND+APP";
        },
        {
          # Kommandotjänst via TCP:
          #   LIST_FILES<newline>  -> listar filer i alla file/flacfile/rawfile-kataloger för kanalen
          #   PLAY_FILE <absolut_filväg><newline> -> spelar .mp3/.flac via befintlig udp_stream-port
          #   LOOP_FILE <absolut_filväg><newline> -> loopar filen tills STOP_PLAYBACK
          #   STOP_PLAYBACK<newline> -> avbryter uppspelning
          type = "file_cmd_tcp_server";
          bind_address = "0.0.0.0";
          bind_port = 9002;
        },
        {
          type = "flacfile";
          directory = "/home/pi/recordings";
          filename_template = "TWR+GND+APP_FLAC";
          include_freq = true;
          split_on_transmission = true;
        },
        {
          type = "rawfile";
          directory = "/home/pi/recordings";
          filename_template = "TWR+GND+APP_IQ";
          include_freq = true;
          split_on_transmission = true;
        },
        {
          type = "udp_stream";
          dest_address = "192.168.1.20";
          dest_port = 9000;
          continuous = false;
        },
        {
          type = "scan_meta_udp";
          dest_address = "192.168.1.20";
          dest_port = 9001;
          continuous = false;
        }
      );
    }
  );
 }
);
