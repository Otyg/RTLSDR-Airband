# Scanner mode + remote Qt GUI example
# Qt GUI connects to this backend over TCP.
#
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

stats_filepath = "/tmp/rtl_airband.prom";

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  correction = 80;
  mode = "scan";
  channels:
  (
    {
      freqs = ( 118.15, 124.7, 132.1 );
      modulation = ( "am", "am", "am" );
      labels = ( "Tower", "Ground", "Approach" );
      outputs: (
        {
          type = "tcp_stream_server";
          bind_address = "0.0.0.0";
          bind_port = 9000;
          continuous = false;
        },
        {
          type = "scan_meta_tcp_server";
          bind_address = "0.0.0.0";
          bind_port = 9001;
          continuous = false;
        }
      );
    }
  );
 }
);
