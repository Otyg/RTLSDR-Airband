# Scanner mode + remote Qt GUI example
# Audio stream and scanner metadata are sent to the GUI host over UDP.
#
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

stats_filepath = "/tmp/rtl_airband.prom";

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  correction = 80;
  mode = "scan";
  channels:
  (
    {
      freqs = ( 118.15, 124.7, 132.1 );
      labels = ( "Tower", "Ground", "Approach" );
      outputs: (
        {
          type = "udp_stream";
          dest_address = "192.168.1.20";
          dest_port = 9000;
          continuous = false;
        },
        {
          type = "scan_meta_udp";
          dest_address = "192.168.1.20";
          dest_port = 9001;
          continuous = false;
        }
      );
    }
  );
 }
);
